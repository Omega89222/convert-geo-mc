<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convertisseur Geo Minecraft</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="panel import-panel" aria-label="Import">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Geo Converter</h1>
            <p>Java / Bedrock</p>
          </div>
        </div>

        <section class="section">
          <label class="field-label" for="conversionDirection">Sens de conversion</label>
          <select id="conversionDirection" class="text-input select-input">
            <option value="to-bedrock">Java / Blockbench vers Bedrock</option>
            <option value="to-java">Bedrock .geo.json vers Java</option>
          </select>
        </section>

        <section class="section">
          <label class="field-label" for="identifier">Identifiant modèle</label>
          <input id="identifier" class="text-input" value="geometry.converted_model" spellcheck="false" />
        </section>

        <section class="section">
          <label class="file-drop" id="modelDrop" for="modelInput">
            <input id="modelInput" type="file" accept=".json,.geo.json,.bbmodel,application/json" />
            <span class="drop-icon"><i data-lucide="file-json"></i></span>
            <span class="drop-title">Modèle JSON</span>
            <span class="drop-meta" id="modelFileName">Modèle d'exemple chargé</span>
          </label>
        </section>

        <section class="section">
          <label class="file-drop texture-drop" id="textureDrop" for="textureInput">
            <input id="textureInput" type="file" accept="image/png,image/jpeg,image/webp" />
            <span class="drop-icon"><i data-lucide="image"></i></span>
            <span class="drop-title">Texture</span>
            <span class="drop-meta" id="textureFileName">Texture de prévisualisation</span>
          </label>
        </section>

        <section class="section">
          <button class="command-button primary convert-button" id="convertButton" type="button">
            <i data-lucide="arrow-right-left"></i>
            <span>Convertir</span>
          </button>
        </section>

        <section class="section compact-grid">
          <div>
            <span class="metric-label">Format</span>
            <strong id="sourceFormat">Java JSON</strong>
          </div>
          <div>
            <span class="metric-label">Cubes</span>
            <strong id="cubeCount">0</strong>
          </div>
          <div>
            <span class="metric-label">Bones</span>
            <strong id="boneCount">0</strong>
          </div>
          <div>
            <span class="metric-label">Texture</span>
            <strong id="textureSize">64 x 64</strong>
          </div>
        </section>

        <section class="section warning-list" id="warningList" aria-live="polite"></section>
      </aside>

      <main class="viewport-panel">
        <div class="topbar">
          <div class="topbar-title">
            <i data-lucide="box"></i>
            <span id="previewTitle">Aperçu 3D</span>
          </div>
          <div class="toolbar">
            <button class="icon-button side-toggle" id="toggleLeftPanel" type="button" aria-label="Masquer le panneau gauche" title="Masquer le panneau gauche">
              <span class="toggle-icon toggle-icon-hide"><i data-lucide="chevrons-left"></i></span>
              <span class="toggle-icon toggle-icon-show"><i data-lucide="chevrons-right"></i></span>
            </button>
            <button class="icon-button side-toggle" id="toggleRightPanel" type="button" aria-label="Masquer le panneau droit" title="Masquer le panneau droit">
              <span class="toggle-icon toggle-icon-hide"><i data-lucide="chevrons-right"></i></span>
              <span class="toggle-icon toggle-icon-show"><i data-lucide="chevrons-left"></i></span>
            </button>
            <button class="icon-button" id="gridToggle" type="button" aria-label="Afficher la grille" title="Afficher la grille">
              <i data-lucide="grid"></i>
            </button>
            <button class="icon-button" id="resetCamera" type="button" aria-label="Réinitialiser la caméra" title="Réinitialiser la caméra">
              <i data-lucide="rotate-ccw"></i>
            </button>
          </div>
        </div>
        <div id="preview" class="preview-canvas" aria-label="Rendu 3D">
          <div id="conversionNotice" class="conversion-notice is-pending" role="status" aria-live="polite">
            <span class="notice-icon notice-icon-pending" aria-hidden="true"><i data-lucide="arrow-right-left"></i></span>
            <span class="notice-icon notice-icon-success" aria-hidden="true"><i data-lucide="circle-check"></i></span>
            <span class="notice-icon notice-icon-error" aria-hidden="true"><i data-lucide="triangle-alert"></i></span>
            <span class="notice-copy">
              <strong id="conversionNoticeTitle">Prêt à convertir</strong>
              <span id="conversionNoticeMeta">Modèle d'exemple chargé</span>
            </span>
          </div>
        </div>
      </main>

      <aside class="panel export-panel" aria-label="Export">
        <div class="export-head">
          <div>
            <h2 id="outputTitle">Bedrock .geo.json</h2>
            <p id="exportStatus" class="status-line">En attente</p>
          </div>
          <div class="toolbar">
            <button class="command-button" id="copyOutput" type="button" disabled>
              <i data-lucide="copy"></i>
              Copier
            </button>
            <button class="command-button primary" id="downloadOutput" type="button" disabled>
              <i data-lucide="download"></i>
              Télécharger
            </button>
          </div>
        </div>
        <textarea id="outputJson" class="output-json" spellcheck="false" aria-label="JSON converti"></textarea>
      </aside>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
